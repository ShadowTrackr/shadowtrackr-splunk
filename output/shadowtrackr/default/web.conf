[expose:shadowtrackr_account]
pattern = shadowtrackr_account
methods = POST, GET

[expose:shadowtrackr_account_specified]
pattern = shadowtrackr_account/*
methods = POST, GET, DELETE

[expose:shadowtrackr_settings]
pattern = shadowtrackr_settings
methods = POST, GET

[expose:shadowtrackr_settings_specified]
pattern = shadowtrackr_settings/*
methods = POST, GET, DELETE

[expose:shadowtrackr_events]
pattern = shadowtrackr_events
methods = POST, GET

[expose:shadowtrackr_events_specified]
pattern = shadowtrackr_events/*
methods = POST, GET, DELETE

[expose:data/indexes]
pattern = data/indexes
methods = GET
