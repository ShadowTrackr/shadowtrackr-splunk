[admin:shadowtrackr_configuration]
match = /
members = shadowtrackr_account, shadowtrackr_settings

[admin:shadowtrackr_inputs]
match = /
members = shadowtrackr_events

[admin_external:shadowtrackr_account]
handlertype = python
python.version = python3
handlerfile = shadowtrackr_rh_account.py
handleractions = edit, list, remove, create
handlerpersistentmode = true

[admin_external:shadowtrackr_settings]
handlertype = python
python.version = python3
handlerfile = shadowtrackr_rh_settings.py
handleractions = edit, list
handlerpersistentmode = true

[admin_external:shadowtrackr_events]
handlertype = python
python.version = python3
handlerfile = shadowtrackr_rh_events.py
handleractions = edit, list, remove, create
handlerpersistentmode = true
