[shadowtrackr_index]
definition = index=shadowtrackr
description = Index that holds ShadowTrackr data. Update this if your inputs or HEC token write to another index.
iseval = 0

[shadowtrackr_events]
definition = `shadowtrackr_index` sourcetype="shadowtrackr:events"
description = ShadowTrackr events feed
iseval = 0

[shadowtrackr_webhook_alerts]
definition = `shadowtrackr_index` sourcetype="shadowtrackr:alert"
description = ShadowTrackr alert results pushed by webhook to the HTTP Event Collector
iseval = 0

[shadowtrackr_inventory_summary]
definition = `shadowtrackr_index` sourcetype="shadowtrackr:inventory:summary"
description = Per-run counts per inventory type, for trends
iseval = 0

# --- Asset 360 ------------------------------------------------------------------

# The search terms for one asset: the asset itself (URLs and host:port reduced
# to the host) plus the IPs it resolves to or the hostnames on it, from the
# inventory lookups. Returns one "term" per row, at most 100. An empty asset
# returns a term that matches nothing, so a subsearch never turns into "all".
# Usage: [| `shadowtrackr_asset_terms("www.example.com")` | rename term AS search | format]
[shadowtrackr_asset_terms(1)]
args = asset
definition = makeresults \
| eval asset=lower(trim("$asset$")) \
| eval asset=if(match(asset, "^\[?[0-9a-f]*:[0-9a-f]*:"), replace(asset, "\]:\d+$|[\[\]]", ""), replace(replace(asset, "^[a-z][a-z0-9+.-]*://", ""), "[/:?#].*$", "")) \
| eval asset=replace(asset, "\.$", "") \
| stenrich field=asset \
| eval term=coalesce(mvappend(asset, st_ip, st_hostnames), "") \
| fields term | mvexpand term | where isnotnull(term) AND term!="" | dedup term | head 100 \
| appendpipe [| stats count | where count=0 | eval term="shadowtrackr-no-asset-given" | fields term] \
| table term
iseval = 0
description = Search terms for an asset (IP, hostname or URL) and its related IPs and hostnames, for the Asset 360 dashboard

# Where Asset 360 looks for your own logs. The defaults use the CIM tags, so
# they work with any CIM-compliant add-on without the CIM data models being
# accelerated. Narrow them to your indexes for speed, e.g.
#   index=pan_logs sourcetype=pan:traffic
[shadowtrackr_asset_network]
definition = index=* tag=network tag=communicate
iseval = 0
description = Firewall and network traffic logs for Asset 360 (default: CIM Network Traffic tags)

[shadowtrackr_asset_web]
definition = index=* tag=web
iseval = 0
description = Proxy, web server and WAF logs for Asset 360 (default: CIM Web tags)

[shadowtrackr_asset_auth]
definition = index=* tag=authentication
iseval = 0
description = Authentication logs for Asset 360 (default: CIM Authentication tags)

[shadowtrackr_asset_ids]
definition = index=* tag=ids tag=attack
iseval = 0
description = IDS/IPS and WAF attack logs for Asset 360 (default: CIM Intrusion Detection tags)
