[ShadowTrackr - Risky service exposed]
disabled = 1
description = ShadowTrackr saw a port open that should rarely face the internet (RDP, SMB, telnet, databases, ...). The ports are in the shadowtrackr_risky_ports lookup; point it at your own CSV to change the list. Throttled per asset and port for a week.
search = `shadowtrackr_events` _index_earliest=-20m@m _index_latest=now (eventid IN (281, 282, 283) OR eventid IN (201, 203, 209, 210, 211, 212, 213, 214, 215, 216, 217, 218, 221, 223, 224, 225, 226, 227, 228, 229, 230, 231, 232, 233, 234, 235, 236, 237, 238, 239, 240, 241, 242, 243, 244, 245, 246, 247, 248, 249, 250, 251, 252, 253, 254, 255, 256, 257, 264, 267, 274)) \
| spath path=ports{} output=st_port_entry \
| eval st_port_entry=coalesce(st_port_entry, "{}") \
| mvexpand st_port_entry \
| eval dest_port=coalesce(spath(st_port_entry, "port"), port), st_port_state=coalesce(spath(st_port_entry, "state"), if(action="deleted", "closed", "open")) \
| where st_port_state="open" \
| lookup shadowtrackr_risky_ports port AS dest_port OUTPUT service reason \
| where isnotnull(service) \
| eval signature="Risky service exposed: ".service." (".dest_port.")" \
| table _time dest dest_ip dest_port service reason signature signature_id severity message vendor_account link id
request.ui_dispatch_app = shadowtrackr
request.ui_dispatch_view = search
cron_schedule = */15 * * * *
dispatch.earliest_time = -7d
dispatch.latest_time = now
enableSched = 1
schedule_window = auto
