[ShadowTrackr - ES asset lookup - Lookup Gen]
disabled = 1
description = Builds the shadowtrackr_es_assets lookup in the Enterprise Security asset format from the inventory: every internet-facing host and website, with priority critical (CISA KEV CVE or ShadowTrackr problem), high (other CVEs), medium (warnings) or low. Register the lookup in ES under Configure > Data Enrichment > Asset and Identity Management.
search = | inputlookup shadowtrackr_hosts where st_present=1 \
| eval st_key=ip, dns=hostnames \
| append [| inputlookup shadowtrackr_websites where st_present=1 \
| eval st_key=url, dns=url, ip=if(match(host, "^[0-9a-fA-F:.]+$"), host, null())] \
| stenrich field=st_key \
| eval priority=case(st_cisa_kev=1 OR problem=1, "critical", st_exploited=1 OR st_vulnerable=1 OR vulnerable=1, "high", warning=1, "medium", true(), "low"), bunit=organization, category="shadowtrackr|internet_facing", is_expected="true", ip=mvjoin(ip, "|"), dns=mvjoin(mvdedup(dns), "|") \
| table ip mac nt_host dns owner priority lat long city country bunit category pci_domain is_expected should_timesync should_update requires_av \
| outputlookup shadowtrackr_es_assets
request.ui_dispatch_app = shadowtrackr
request.ui_dispatch_view = search
cron_schedule = 15 17 * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
