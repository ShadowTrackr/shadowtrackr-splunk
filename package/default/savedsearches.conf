| eval dest_port=coalesce(spath(st_port_entry, "port"), port), st_port_state=coalesce(spath(st_port_entry, "state"), if(action="deleted", "closed", "open")) \
| where st_port_state="open" \
| lookup shadowtrackr_risky_ports port AS dest_port OUTPUT service reason \
| where isnotnull(service) \
| eval signature="Risky service exposed: ".service." (".dest_port.")" \
| table _time dest dest_ip dest_port service reason signature signature_id severity message vendor_account link id
