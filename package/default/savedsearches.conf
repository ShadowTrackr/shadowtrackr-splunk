[ShadowTrackr - Health - No events received]
disabled = 1
description = The ShadowTrackr Events input indexed nothing in the last 24 hours. Check the input and the shadowtrackr_*.log files in index=_internal.
search = | tstats count max(_indextime) as last_indexed where `shadowtrackr_events` \
| eval hours_since=round((now()-last_indexed)/3600, 1), last_indexed=strftime(last_indexed, "%F %T %Z"), st_check="events" \
| where isnull(hours_since) OR hours_since>24 \
| table st_check last_indexed hours_since
