[ShadowTrackr - New known exploited vulnerability]
disabled = 1
description = A newly found CVE on one of your assets is known to be exploited, is on the CISA KEV list or has an NCSC NL advisory. Uses the inventory lookups (run the Inventory input); the first inventory sync is the baseline and does not alert. One result per asset.
search = | inputlookup shadowtrackr_cves \
| eventstats min(st_first_synced) as st_baseline \
| where st_present=1 AND st_first_synced>=relative_time(now(), "-2h") AND st_first_synced>st_baseline+3600 AND (exploited=1 OR cisa_kev=1 OR (isnotnull(ncsc) AND ncsc!="")) \
| eval threat_intel=mvappend(if(exploited=1, "known exploited", null()), if(cisa_kev=1, "CISA KEV", null()), if((isnotnull(ncsc) AND ncsc!=""), "NCSC NL", null())) \
| stats values(cve) as cve values(software) as software max(cvss) as cvss values(threat_intel) as threat_intel dc(cve) as cve_count values(organization) as vendor_account by asset \
| rename asset as dest \
| eval signature="Known exploited vulnerability", severity=if(cvss>=9, "critical", "high"), st_cve_key=mvjoin(mvsort(cve), ",") \
| table dest cve cve_count cvss threat_intel software signature severity vendor_account st_cve_key
request.ui_dispatch_app = shadowtrackr
request.ui_dispatch_view = search
cron_schedule = 35 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
schedule_window = auto
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = dest,st_cve_key
alert.suppress.period = 604800s
alert.severity = 5
alert.track = 1

[ShadowTrackr - Certificate expiring]
disabled = 1
description = A certificate on one of your websites expires within `shadowtrackr_cert_expiry_days` days (default 14) or expired in the last 30 days, and has not been renewed. Uses the inventory lookups.
search = | inputlookup shadowtrackr_certificates where st_present=1 \
| search NOT renewed=1 NOT revoked=1 \
| eval days_left=floor((strptime(not_after, "%Y-%m-%dT%H:%M:%SZ")-now())/86400) \
| where days_left<=`shadowtrackr_cert_expiry_days` AND days_left>=-30 \
| eval dest=url, dest_ip=host, vendor_account=organization, signature=if(days_left<0, "Certificate expired", "Certificate expires soon"), severity=case(days_left<0, "high", days_left<=7, "medium", true(), "low") \
| table dest dest_ip cn issuer_cn not_after days_left serial sha256 signature severity vendor_account
