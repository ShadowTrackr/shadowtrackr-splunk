[ShadowTrackr - External login on exposed remote access]
disabled = 1
description = A successful remote login (SSH, RDP, VNC, telnet, WinRM; logins without an app field count too) from an internet address on an asset where ShadowTrackr sees such a service open to the internet. Reads the shadowtrackr_asset_auth macro (CIM Authentication tags by default).
search = `shadowtrackr_asset_auth` action=success \
| fillnull value="unknown" app \
| where app="unknown" OR match(app, "(?i)ssh|rdp|ms-wbt|terminal|vnc|telnet|winrm|wsman") \
| stats count min(_time) as firstTime max(_time) as lastTime values(app) as app by dest user src \
| where match(src, "^[0-9a-fA-F:.]+$") AND NOT (cidrmatch("10.0.0.0/8", src) OR cidrmatch("172.16.0.0/12", src) OR cidrmatch("192.168.0.0/16", src) OR cidrmatch("127.0.0.0/8", src) OR cidrmatch("100.64.0.0/10", src) OR cidrmatch("169.254.0.0/16", src) OR cidrmatch("fc00::/7", src) OR cidrmatch("fe80::/10", src) OR src="::1") \
| stenrich field=dest \
| where st_known=1 AND match(mvjoin(st_services, " "), "(?i)ssh|rdp|ms-wbt|terminal|vnc|telnet|winrm|wsman") \
| eval severity="medium" \
| table dest user src count firstTime lastTime app st_services severity st_organization
