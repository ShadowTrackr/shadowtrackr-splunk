[shadowtrackr:events]
category = Network & Security
description = ShadowTrackr events feed (JSON)
pulldown_type = 1
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 50000
KV_MODE = json
TIME_PREFIX = "timestamp":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 30
TZ = UTC

# Calculated fields run after JSON extraction but before lookups, so they
# cannot depend on each other or on the event type lookup below.
EVAL-vendor = "ShadowTrackr"
EVAL-product = "ShadowTrackr"
EVAL-vendor_product = "ShadowTrackr"
EVAL-app = "ShadowTrackr"
EVAL-message = replace(msg, "<br\s*/?>", " - ")
EVAL-description = replace(msg, "<br\s*/?>", " - ")
EVAL-severity = case(level>=90, "high", level>=80, "medium", level>=60, "low", isnotnull(level), "informational")
EVAL-st_status = case(level>=90, "problem", level>=80, "warning", isnotnull(level), "info")
EVAL-type = if(level>=80, "alert", "event")
EVAL-dest = coalesce(dst, mvindex(split(request, "&"), 0))
EVAL-object = coalesce(dst, mvindex(split(request, "&"), 0))
EVAL-dest_ip = case(match(request, "(^|&)w?ip=[^&]+"), replace(request, "^(?:.*&)?w?ip=([^&]*).*$", "\1"), match(dst, "^\d{1,3}(\.\d{1,3}){3}$") OR match(dst, "^[0-9a-fA-F:]+:[0-9a-fA-F:]*$"), dst)
EVAL-url = if(match(request, "(^|&)url=[^&]+"), replace(request, "^(?:.*&)?url=([^&]*).*$", "\1"), null())
EVAL-cloud_provider = if(match(request, "(^|&)cloudprovider=[^&]+"), replace(request, "^(?:.*&)?cloudprovider=([^&]*).*$", "\1"), null())
EVAL-cert_serial = if(match(request, "(^|&)serial=[^&]+"), replace(request, "^(?:.*&)?serial=([^&]*).*$", "\1"), null())
EVAL-cve = if(match(msg, "CVE-\d{4}-\d+"), replace(msg, "^.*?(CVE-\d{4}-\d+).*$", "\1"), null())
# The JSON key "source" clashes with the Splunk source field, so read it from _raw.
EVAL-st_source = spath(_raw, "source")
EVAL-category = spath(_raw, "source")
EVAL-status = "success"
FIELDALIAS-shadowtrackr_ids = eventid AS signature_id event_hash AS id

LOOKUP-shadowtrackr_event_types = shadowtrackr_event_types eventid OUTPUT st_category st_cim_type signature change_type object_category action
