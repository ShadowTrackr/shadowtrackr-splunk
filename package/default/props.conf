[shadowtrackr:events]
category = Network & Security
description = ShadowTrackr events feed (JSON)
pulldown_type = 1
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 50000
KV_MODE = json
TIME_PREFIX = "timestamp":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 30
TZ = UTC

# Calculated fields run after JSON extraction but before lookups, so they
# cannot depend on each other or on the event type lookups below. The
# coalesce() fallbacks parse the legacy fields for events from older API
# versions that lack the structured fields.
EVAL-vendor = "ShadowTrackr"
EVAL-product = "ShadowTrackr"
EVAL-vendor_product = "ShadowTrackr"
EVAL-app = "ShadowTrackr"
EVAL-vendor_account = 'organization.name'
EVAL-message = coalesce(message_text, replace(msg, "<br\s*/?>", " - "))
EVAL-description = coalesce(message_text, replace(msg, "<br\s*/?>", " - "))
EVAL-severity = case(level>=90, "high", level>=80, "medium", level>=60, "low", isnotnull(level), "informational")
EVAL-st_status = case(level>=90, "problem", level>=80, "warning", isnotnull(level), "info")
EVAL-type = if(level>=80, "alert", "event")
EVAL-dest = coalesce(asset, dst, mvindex(split(request, "&"), 0))
EVAL-object = coalesce(asset, dst, mvindex(split(request, "&"), 0))
EVAL-dest_ip = coalesce(ip, case(match(request, "(^|&)w?ip=[^&]+"), replace(request, "^(?:.*&)?w?ip=([^&]*).*$", "\1"), match(dst, "^\d{1,3}(\.\d{1,3}){3}$") OR match(dst, "^[0-9a-fA-F:]+:[0-9a-fA-F:]*$"), dst))
EVAL-dest_port = coalesce(port, 'ports{}.port')
EVAL-url = if(match(request, "(^|&)url=[^&]+"), replace(request, "^(?:.*&)?url=([^&]*).*$", "\1"), null())
EVAL-cloud_provider = coalesce(cloud_provider, if(match(request, "(^|&)cloudprovider=[^&]+"), replace(request, "^(?:.*&)?cloudprovider=([^&]*).*$", "\1"), null()))
EVAL-cert_serial = coalesce(cert_serial, if(match(request, "(^|&)serial=[^&]+"), replace(request, "^(?:.*&)?serial=([^&]*).*$", "\1"), null()))
EVAL-cve = coalesce('cve{}', if(match(msg, "CVE-\d{4}-\d+"), replace(msg, "^.*?(CVE-\d{4}-\d+).*$", "\1"), null()))
EVAL-object_attrs = 'changes{}.attribute'
EVAL-action = case(isnotnull(mvfind('ports{}.state', "^opened$")) AND isnull(mvfind('ports{}.state', "^(closed|changed)$")), "created", isnotnull(mvfind('ports{}.state', "^closed$")) AND isnull(mvfind('ports{}.state', "^(opened|changed)$")), "deleted", isnotnull('changes{}.attribute') AND isnull(old_value) AND isnotnull(new_value), "created", match(msg, "(?i)\b(changed?|changes|renewed|again|weakened|downgraded|upgraded)\b"), "modified", match(msg, "(?i)\b(removed|closed|deleted|no longer)\b"), "deleted", match(msg, "(?i)\b(added|opened|new|discovered|detected)\b"), "created", true(), "modified")
# The JSON key "source" clashes with the Splunk source field, so read it from _raw.
EVAL-st_source = spath(_raw, "source")
EVAL-category = spath(_raw, "source")
EVAL-status = "success"
# Events from older API versions have no id; event_hash identifies them.
FIELDALIAS-shadowtrackr_ids = eventid AS signature_id event_hash ASNEW id

# Event type classification. Lookups run in name order: the curated CSV
# first, then the catalogue refreshed daily from the API fills the gaps.
LOOKUP-1_shadowtrackr_curated = shadowtrackr_event_types eventid OUTPUT signature st_category st_cim_type change_type object_category
LOOKUP-2_shadowtrackr_catalog = shadowtrackr_event_type_catalog eventid OUTPUTNEW title AS signature category AS st_category
LOOKUP-3_shadowtrackr_catalog_change = shadowtrackr_event_type_catalog eventid OUTPUTNEW category AS change_type category AS object_category
LOOKUP-4_shadowtrackr_catalog_info = shadowtrackr_event_type_catalog eventid OUTPUT name AS st_event_name is_change AS st_is_change

[shadowtrackr:alert]
category = Network & Security
description = ShadowTrackr alert results pushed by webhook to the HTTP Event Collector
pulldown_type = 1
SHOULD_LINEMERGE = false
TRUNCATE = 100000
KV_MODE = json
EVAL-vendor = "ShadowTrackr"
EVAL-product = "ShadowTrackr"
EVAL-vendor_product = "ShadowTrackr"
EVAL-app = "ShadowTrackr"
EVAL-type = "alert"
EVAL-signature = alert
EVAL-signature_id = alert_id
EVAL-description = alert
EVAL-dest = coalesce('result.url', 'result.asset', 'result.host', 'result.domain', 'result.ip')
