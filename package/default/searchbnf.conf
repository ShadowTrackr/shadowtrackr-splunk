[shadowtrackr-command]
syntax = shadowtrackr query=<string> (account=<string>)? (max_results=<int>)?
shortdesc = Runs a live query against the ShadowTrackr API.
description = Runs a query in the ShadowTrackr search language (the same as the search box in ShadowTrackr) \
  against the v4 API and returns the rows as results. Comma-separated lists such as tcp_ports and software become \
  multivalue fields and booleans become 1/0. Without account=, the only configured account is used. max_results \
  limits the rows returned (default 10000, 0 for no limit). Reading the API key needs the list_storage_passwords \
  capability, which admin has.
usage = public
example1 = | shadowtrackr query="index=hosts problem=yes"
comment1 = Hosts with a problem.
example2 = | shadowtrackr query="index=certificates by issuer earliest=-7d"
comment2 = Certificates seen in the last 7 days, counted per issuer.
example3 = | shadowtrackr query="index=events earliest=-1d level>=80" | stats count by source
comment3 = Warnings and problems of the last day, counted per source in Splunk.
related = stenrich
tags = shadowtrackr easm attack surface

[stenrich-command]
syntax = stenrich field=<field> (type=(auto|ip|domain))? (prefix=<string>)?
shortdesc = Adds ShadowTrackr context to IPs, hostnames and URLs.
description = Looks up the value of a field in the ShadowTrackr inventory lookups and adds st_* fields: \
  st_known, st_in_scope, st_asset_type, st_ip, st_hostnames, st_domain, st_ports, st_services, st_software, \
  st_problems, st_warnings, st_vulnerable, st_cves, st_max_cvss, st_exploited, st_cert_grade, st_cert_expires, \
  st_phishy, st_lookalike_of and more. URLs, host:port and user@host are reduced to the host. Each distinct value \
  is looked up once per search. Makes no API calls; the data comes from the ShadowTrackr Inventory input.
usage = public
example1 = index=firewall action=allowed | stenrich field=dest_ip | where st_known=1 AND st_vulnerable=1
comment1 = Allowed traffic to your own internet-facing assets that have known vulnerabilities.
example2 = index=proxy | stenrich field=url | where st_phishy=1
comment2 = Proxy requests to lookalike (phishy) domains.
related = shadowtrackr lookup
tags = shadowtrackr enrich easm
