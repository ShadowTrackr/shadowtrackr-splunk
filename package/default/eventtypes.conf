[shadowtrackr_events]
search = sourcetype="shadowtrackr:events"
description = All ShadowTrackr events

[shadowtrackr_alert]
search = sourcetype="shadowtrackr:events" level>=90
description = ShadowTrackr problems (level 90 and above). Tagged alert.

[shadowtrackr_warning]
search = sourcetype="shadowtrackr:events" level>=80 level<90
description = ShadowTrackr warnings (level 80-89). The alert tag is off by default; enable it under Settings > Tags if you also want warnings as alerts.

[shadowtrackr_change]
search = sourcetype="shadowtrackr:events" (st_cim_type="change" OR (NOT st_cim_type=* st_is_change="true"))
description = Changes to assets detected by ShadowTrackr

[shadowtrackr_vulnerability]
search = sourcetype="shadowtrackr:events" (st_cim_type="vulnerability" OR (NOT st_cim_type=* st_category="vulnerability"))
description = Vulnerabilities reported by ShadowTrackr (CISA KEV, NCSC advisories, subdomain takeover, ...)

[shadowtrackr_discovery]
search = sourcetype="shadowtrackr:events" (st_cim_type="discovery" OR (NOT st_cim_type=* st_category="discovery"))
description = New assets and records discovered by ShadowTrackr

[shadowtrackr_webhook_alert]
search = sourcetype="shadowtrackr:alert" NOT truncated=true
description = Results of ShadowTrackr alerts pushed by webhook (excluding the marker sent when results were cut off)
