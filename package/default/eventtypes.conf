[shadowtrackr_events]
search = sourcetype="shadowtrackr:events"
description = All ShadowTrackr events

[shadowtrackr_alert]
search = sourcetype="shadowtrackr:events" level>=80
description = ShadowTrackr events with a warning (80-89) or problem (90+) level

[shadowtrackr_change]
search = sourcetype="shadowtrackr:events" st_cim_type="change"
description = Changes to assets detected by ShadowTrackr

[shadowtrackr_vulnerability]
search = sourcetype="shadowtrackr:events" st_cim_type="vulnerability"
description = Vulnerabilities reported by ShadowTrackr (CISA KEV, NCSC advisories, subdomain takeover)

[shadowtrackr_discovery]
search = sourcetype="shadowtrackr:events" st_cim_type="discovery"
description = New assets and records discovered by ShadowTrackr
